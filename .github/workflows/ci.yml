name: ci
on:
  pull_request:
    branches: [devai, main]
  push:
    branches: [devai]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # TECH-003: fijar estas acciones por SHA de commit antes de publicar (Art. 24).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run lint
      - run: npm run build
      - run: npm test
